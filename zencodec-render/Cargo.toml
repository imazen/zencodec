[package]
name = "zencodec-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Checked canvas rendering and color conversion for zencodec collections"
repository = "https://github.com/imazen/zencodec"
publish = false

# Isolated while the converter contract is on a review revision. Basic codec
# consumers do not acquire rendering/CMS dependencies. Release removes patches.
[workspace]

[features]
default = []
media = ["dep:zencodec-media"]

[dependencies]
zencodec = { path = "..", version = ">=0.3.0, <0.5.0" }
zencodec-media = { path = "../zencodec-media", version = ">=0.2.0, <0.3.0", optional = true }
zenpixels = { version = ">=0.5.0, <0.6.0", default-features = false }
zenpixels-convert = { version = ">=0.5.0, <0.6.0", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }

[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "83217972759fab02ff530fe50203a0c7fc3282f8" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "83217972759fab02ff530fe50203a0c7fc3282f8" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
