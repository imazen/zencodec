[package]
name = "zencodec-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Checked canvas rendering and color conversion for zencodec collections"
repository = "https://github.com/imazen/zencodec"
publish = false

# Isolated while the converter contract is on a review revision. Basic codec
# consumers do not acquire rendering/CMS dependencies. Release removes patches.
[workspace]

[dependencies]
zencodec = { path = "..", version = ">=0.1.27, <0.3.0" }
zenpixels = { version = ">=0.2.17, <0.4.0", default-features = false }
zenpixels-convert = { version = ">=0.2.17, <0.4.0", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }

[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "86d0e2d30406a006bf8332f142029b7f58353086" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "86d0e2d30406a006bf8332f142029b7f58353086" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
