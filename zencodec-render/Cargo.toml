[package]
name = "zencodec-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Checked canvas rendering and color conversion for zencodec collections"
repository = "https://github.com/imazen/zencodec"
publish = false

# Isolated while the converter contract is on a review revision. Basic codec
# consumers do not acquire rendering/CMS dependencies. Release removes patches.
[workspace]

[dependencies]
zencodec = { path = "..", version = ">=0.2.0, <0.4.0" }
zenpixels = { version = ">=0.3.1, <0.5.0", default-features = false }
zenpixels-convert = { version = ">=0.3.1, <0.5.0", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }

[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
