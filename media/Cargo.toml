[workspace]
members = ["crates/zencodec-media-testkit", "crates/zencodec-media-codec-tests"]
default-members = [".", "crates/zencodec-media-testkit"]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "zencodec-media"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0 OR MIT"
description = "Experimental animation and video integration for zen codecs"
repository = "https://github.com/imazen/zencodec"

[features]
default = []
animation = ["dep:zencodec"]
av1-decode = ["dep:rav1d-safe", "dep:whereat"]
av1-encode = ["dep:zenrav1e"]
http = ["dep:ureq"]

[dependencies]
zencodec = { version = ">=0.1.27, <0.3.0", optional = true }
tempfile = "3.27"
linear-srgb = { version = "0.6.12", default-features = false, features = ["std", "iec", "transfer"] }
zentone = { version = "0.2.0", default-features = false, features = ["std"] }
ureq = { version = "3.4.1", default-features = false, features = ["rustls"], optional = true }
zenpixels = { version = ">=0.2.16, <0.4.0", default-features = false }
rav1d-safe = { version = "0.6.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }

zenrav1e = { version = "0.2.0", default-features = false, features = ["stop"], optional = true }

enough = { version = "0.4", default-features = false, features = ["std"] }
whereat = { version = "0.1.5", optional = true }

[dev-dependencies]
zencodec-media-testkit = { path = "crates/zencodec-media-testkit" }
serde_json = "1"

[patch.crates-io]
zenavif = { git = "https://github.com/imazen/zenavif", rev = "b777fa12a92059d3d50c0bfa12e30d2b10502df6" }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "561849318d6839f478fa7cbc73d67e6d489d4860" }
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", rev = "3c1be8179ac7fdb7e7322e299cdad645046acf6c" }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "ce1a28b41b71b66b19240dce0d1b6f0579c8064d" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "60838e9bb8c17a3bb3d91694aad67271170e5b8f" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "633f71e9d0c8fc82cc29b58ffaa92d367d82f9f9" }
butteraugli = { git = "https://github.com/imazen/butteraugli", rev = "795aa3727252dc56840501864aefc4a8a537c8ea" }
zengif = { git = "https://github.com/imazen/zengif", rev = "1d91101ae53b92833124087624f2f0238fabd760" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "27393eef995aea329cfbc1df5cac5e3f7346b4cb" }
zenwebp = { git = "https://github.com/imazen/zenwebp", rev = "6b580c2532fc765e8a913011c55b9b8f3cfcb4eb" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f28f6b891b1dbf95d31feb5805078a582707c561" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zencodec = { path = ".." }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "c56e7940f4a123fb653bc60593376cf2eaed3e70" }
zentone = { git = "https://github.com/imazen/zentone", rev = "9f0dab49bffa194b4a52b5eb28ba15b2d958356d" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f28f6b891b1dbf95d31feb5805078a582707c561" }
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "dfd01e3268f6e8da862d2d5f0a71d19f414f2b87" }

zenrav1e = { git = "https://github.com/imazen/zenrav1e", rev = "9057c4bacf1d8a23974e32de09fd4446a1cc525a" }

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "generate_av1_corpus"
required-features = ["av1-encode", "av1-decode"]
