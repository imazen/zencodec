[package]
name = "reimagined-native-tiff"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zencodec = { path = "../../zencodec", features = ["std"] }
zencodec-io = { path = "../../zencodec-io" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "3286169c7ef5b1e66ac841c3d8204eb54e390f8c", default-features = false, features = ["std", "icc"] }
# The existing spatial qualification oracle/parser, with its original source pin.
# This standalone validation package is not part of any shipped codec graph.
tiff = { version = "0.11.3", git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5", default-features = false }

[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
