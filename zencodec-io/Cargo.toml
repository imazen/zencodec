[package]
name = "zencodec-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
description = "Drivers that run zencodec incremental and pull-based decoders over files, streams, slices and async sources"
categories = ["multimedia::images"]
keywords = ["image", "codec", "streaming", "sans-io"]
repository = "https://github.com/imazen/zencodec"
include = ["/src/**", "/README.md", "/LICENSE*"]
publish = false

[features]
default = []
# `std::io::Read` pumps, file sources and the buffered stream adapter.
std = ["zencodec/std"]
# Async drivers (`tokio_io`): `tokio::sync` and `tokio::io` only; never starts a runtime.
tokio = ["std", "dep:tokio"]

[dependencies]
zencodec = { path = "..", version = ">=0.1.27, <0.3.0" }
zenpixels = { version = ">=0.2.14, <0.4.0" }
enough = "0.4.4"
how-far = { version = "0.1.0", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["sync", "io-util", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
zencodec-coroutine = { path = "../zencodec-coroutine" }
enough = "0.4.4"
almost-enough = "0.4.4"

zenbench = "0.1.11"

[[test]]
name = "drivers"
required-features = ["std"]

[[bench]]
name = "drivers"
harness = false
required-features = ["std"]
