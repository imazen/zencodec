name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    name: Execute guide examples
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perf/io-validation
      - name: Fetch pinned public codec sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 perf/io-validation/setup.py
          cp perf/io-validation/locks/harness.lock perf/io-validation/Cargo.lock
      - name: Execute the exact Rust displayed in the guide
        run: |
          cargo test --manifest-path perf/io-validation/Cargo.toml -p io-validation --test site_examples --test encoder_retention --test policy_resolution --test policy_engine --test policy_execution --test policy_native --test policy_disclosure --test policy_stream --bin policy_media --bin transport_contracts --locked
          cargo clippy --manifest-path perf/io-validation/Cargo.toml -p io-validation --test site_examples --test encoder_retention --test policy_resolution --test policy_engine --test policy_execution --test policy_native --test policy_disclosure --test policy_stream --bin policy_media --bin transport_contracts --locked -- -D warnings
      - name: Verify committed simulation results
        run: |
          cargo run --quiet --manifest-path perf/io-validation/Cargo.toml -p io-validation --bin transport_contracts --locked > "$RUNNER_TEMP/transport.csv"
          diff -u benchmarks/io_transport_model_2026-10-25.csv "$RUNNER_TEMP/transport.csv"
      - name: Check policy portability without the native harness
        run: |
          cp perf/policy-check/dependencies.lock perf/policy-check/Cargo.lock
          cargo check --manifest-path perf/policy-check/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo check --manifest-path perf/policy-check/Cargo.toml --locked --no-default-features --target thumbv7em-none-eabihf
          cargo test --manifest-path perf/policy-check/Cargo.toml --locked --no-default-features --lib
          cargo clippy --manifest-path perf/policy-check/Cargo.toml --locked --no-default-features --lib -- -D warnings

  jpeg:
    name: Qualify native JPEG contracts
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      JPEG_POLICY_ARTIFACTS: ${{ github.workspace }}/perf/jpeg-policy-validation/target/oracle
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perf/jpeg-policy-validation
      - name: Install independent JPEG oracle
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo-progs
      - name: Test pinned JPEG configurations and metadata boundaries
        run: |
          cp perf/jpeg-policy-validation/dependencies.lock perf/jpeg-policy-validation/Cargo.lock
          cargo test --manifest-path perf/jpeg-policy-validation/Cargo.toml --locked -- --nocapture --test-threads=1
          cargo clippy --manifest-path perf/jpeg-policy-validation/Cargo.toml --all-targets --locked -- -D warnings

  av1:
    name: Qualify native AV1 policy and guide
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      AV1_POLICY_ARTIFACTS: ${{ github.workspace }}/perf/av1-policy-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perf/av1-policy-validation
      - name: Install independent AV1 oracle
        timeout-minutes: 6
        run: |
          # The Azure package mirror exhausted the entire job deadline while
          # downloading FFmpeg. Keep Ubuntu's signed packages, using its archive
          # mirror and explicit command deadlines instead.
          # Hosted images also resolve URIs through mirror+file, so changing the
          # sources file alone does not change their selected download host.
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=15s 2m apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout --kill-after=15s 3m apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          timeout --kill-after=5s 10s ffmpeg -version
      - name: Test pinned native ownership, policy and independent readback
        run: |
          cp perf/av1-policy-validation/dependencies.lock perf/av1-policy-validation/Cargo.lock
          timeout --kill-after=15s 10m cargo test --manifest-path perf/av1-policy-validation/Cargo.toml --locked -- --nocapture --test-threads=1
          timeout --kill-after=15s 5m cargo clippy --manifest-path perf/av1-policy-validation/Cargo.toml --all-targets --locked -- -D warnings

  spatial:
    name: Qualify native TIFF and JXL image selection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      SPATIAL_ARTIFACTS: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}
      SPATIAL_GENERATED_ARTIFACTS: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-generated
      SPATIAL_LAYER_ARTIFACTS: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-layers
      SPATIAL_PROJECTION_ARTIFACTS: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-projection
      SPATIAL_INVENTORY_ARTIFACTS: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-inventory
      SPATIAL_ORACLE_PYTHON: ${{ github.workspace }}/perf/spatial-validation/target/oracle-python/bin/python
      JXL_SELECTION_ORACLE: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-jxl/jxl-oracle
      JXL_LAYER_ORACLE: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-jxl/layer-oracle
      SPATIAL_COLOR_ORACLE: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-cms/color-oracle
      SPATIAL_COLOR_ARTIFACTS: ${{ github.workspace }}/perf/spatial-validation/target/oracle-${{ github.run_id }}-${{ github.run_attempt }}-color
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perf/spatial-validation
      - name: Install pinned independent libtiff oracle
        timeout-minutes: 3
        run: |
          timeout --kill-after=10s 30s python3 -m venv perf/spatial-validation/target/oracle-python
          timeout --kill-after=10s 2m "$SPATIAL_ORACLE_PYTHON" -m pip install --disable-pip-version-check --only-binary :all: --retries 1 --timeout 20 Pillow==13.0.0
      - name: Build pinned independent libjxl oracles
        timeout-minutes: 8
        run: |
          # Use the same signed-package mirror and bounded downloads as AV1.
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=15s 2m apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout --kill-after=15s 2m apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends cmake ninja-build libhwy-dev libbrotli-dev liblcms2-dev
          timeout --kill-after=15s 6m python3 perf/spatial-validation/build_jxl_oracles.py "$(dirname "$JXL_SELECTION_ORACLE")"
          timeout --kill-after=10s 1m python3 perf/spatial-validation/build_color_oracle.py "$(dirname "$SPATIAL_COLOR_ORACLE")"
      - name: Execute native spatial selection and exact guide example
        run: |
          cp perf/spatial-validation/dependencies.lock perf/spatial-validation/Cargo.lock
          timeout --kill-after=15s 10m cargo test --manifest-path perf/spatial-validation/Cargo.toml --features cms_oracle,old_jpeg --locked -- --nocapture --test-threads=1
          timeout --kill-after=15s 5m cargo clippy --manifest-path perf/spatial-validation/Cargo.toml --features cms_oracle,old_jpeg --all-targets --locked -- -D warnings
      - name: Retain independent layer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spatial-oracles-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            perf/spatial-validation/target/oracle-*-jxl/provenance.json
            perf/spatial-validation/target/oracle-*-jxl/commands.json
            perf/spatial-validation/target/oracle-*-layers/**/*.json
            perf/spatial-validation/target/oracle-*-layers/**/stderr.txt
            perf/spatial-validation/target/oracle-*-cms/provenance.json
            perf/spatial-validation/target/oracle-*-color/**/comparison.json
            perf/spatial-validation/target/oracle-*-color/**/publication.json
            perf/spatial-validation/target/oracle-*-projection/**/*.json
            perf/spatial-validation/target/oracle-*-projection/**/*.txt
            perf/spatial-validation/target/oracle-*-inventory/**/*.json
            perf/spatial-validation/target/oracle-*-color/**/stderr.txt
          if-no-files-found: error

  build:
    name: Build and exercise guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs --ignore-scripts
      - run: npm run build --prefix docs
      - run: npm test --prefix docs
      - name: Install browser
        working-directory: docs
        timeout-minutes: 8
        run: |
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          timeout --kill-after=15s 3m npx playwright install-deps chromium
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=20000 timeout --kill-after=15s 3m npx playwright install chromium
      - name: Check navigation, diagrams, examples and mobile layout
        run: |
          python3 -m http.server 3537 --bind 127.0.0.1 --directory docs/_site > "$RUNNER_TEMP/docs-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3537/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser --prefix docs
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload explicit site artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [examples, jpeg, av1, spatial, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@v5
