[package]
name = "zencodec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.zencodec]
path = ".."

[[bin]]
name = "exif_parse"
path = "fuzz_targets/exif_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exif_roundtrip"
path = "fuzz_targets/exif_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exif_filter"
path = "fuzz_targets/exif_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_filtered"
path = "fuzz_targets/metadata_filtered.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exif_author"
path = "fuzz_targets/exif_author.rs"
test = false
doc = false
bench = false

# Standalone workspace: inherit the same pixel cohort as the codec traits.
[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
