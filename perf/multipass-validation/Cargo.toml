[package]
name = "multipass-validation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototype of bounded multi-pass raster input for zencodec"

[workspace]

[dependencies]
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zenpixels = ">=0.2.14, <0.4.0"
enough = "0.4.4"

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Paired precision verifier; release requires these APIs in published zenpixels.
[patch.crates-io]
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
