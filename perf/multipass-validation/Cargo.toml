[package]
name = "multipass-validation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototype of bounded multi-pass raster input for zencodec"

[workspace]

[dependencies]
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zenpixels = ">=0.2.14, <0.4.0"
enough = "0.4.4"

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
