[package]
name = "policy-portability-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["full-zencodec"]
full-zencodec = ["dep:zencodec"]

[dependencies]
zencodec = { path = "../..", version = ">=0.3.0, <0.5.0", default-features = false, optional = true }
whereat = { version = "0.1.5", default-features = false }
enough = { version = "0.4.4", default-features = false }
how-far = { version = "0.1.0", default-features = false }
zenpixels = { version = ">=0.5.0, <0.6.0", default-features = false }

# Paired precision verifier; release requires these APIs in published zenpixels.
[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "0f0ad4c019fd827de2ee24f0c08e577fb2af6852" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "0f0ad4c019fd827de2ee24f0c08e577fb2af6852" }
