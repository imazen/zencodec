[package]
name = "policy-portability-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["full-zencodec"]
full-zencodec = ["dep:zencodec"]

[dependencies]
zencodec = { path = "../..", version = ">=0.1.27, <0.3.0", default-features = false, optional = true }
whereat = { version = "0.1.5", default-features = false }
enough = { version = "0.4.4", default-features = false }
how-far = { version = "0.1.0", default-features = false }
zenpixels = { version = ">=0.2.16, <0.4.0", default-features = false }

# Paired precision verifier; release requires these APIs in published zenpixels.
[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
