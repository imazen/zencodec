[package]
name = "jpeg-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zencodec = { path = "../..", version = ">=0.1.27, <0.3.0", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-coroutine = { path = "../../zencodec-coroutine", version = "0.1.0" }
zenmeta = { path = "../../zenmeta", features = ["rewrite", "xmp"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["icc-db"] }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "4535ec499d88b04f58882df03e61761526c35756", features = ["controlled-decode", "metadata-rewrite", "extended-metadata"] }

zencodecs = { git = "https://github.com/imazen/zenpipe", rev = "ffecbf56ec8dc0ebcc6dbb16eb1d5925dccd37a5", default-features = false, features = ["std", "cms", "jpeg", "png", "checked-transcode-async"] }

[patch.crates-io]
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "4535ec499d88b04f58882df03e61761526c35756" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "7f13367f8f2d8ad78f60c9638c07214997451f54" }
zencodec = { path = "../.." }
# Reproduce zenjpeg main's unpublished workspace bridges at immutable commits.
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "8ca647c525cf488c61bbf35475ca8ba3db6b628e" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "27eeaf439faa5d71cc9b489d4ff141bf15582759" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "27eeaf439faa5d71cc9b489d4ff141bf15582759" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-coroutine = { path = "../../zencodec-coroutine" }
zenmeta = { path = "../../zenmeta" }

[dev-dependencies]
kamadak-exif = "0.6.1"

[profile.release]
debug = 1
lto = "thin"
