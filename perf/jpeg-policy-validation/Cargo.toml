[package]
name = "jpeg-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
# The effective-job preflight scenarios: planning (`EncodeJob::plan_encode`)
# against native startup (`Encoder::begin_declared`) on the pinned zenjpeg.
# They began as a patch experiment and now run on zenjpeg's shared hooks.
native-preflight = []

[dependencies]
zencodec = { path = "../..", version = ">=0.1.27, <0.3.0", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-coroutine = { path = "../../zencodec-coroutine", version = "0.1.0" }
zenmeta = { path = "../../zenmeta", features = ["rewrite", "xmp"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["icc-db"] }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "8672e549793a7e1b515f292bd9fd77109118cb83", features = ["controlled-decode", "metadata-rewrite", "extended-metadata"] }

zencodecs = { git = "https://github.com/imazen/zenpipe", rev = "874a3856841bfcf5f8e223ec62d75a159fa42895", default-features = false, features = ["std", "cms", "jpeg", "png", "checked-transcode-async"] }

[patch.crates-io]
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "8672e549793a7e1b515f292bd9fd77109118cb83" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "5422b6d213e41f9764e7c4cf98e5c44eb8acbd85" }
zencodec = { path = "../.." }
# zenjpeg depends on ultrahdr-core unconditionally; crates.io 0.6.0 requires
# zencodec ^0.1, so use the review revision on the zencodec 0.2 family pin.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "cc57c57abc491001c69ca85dab8213102df93825" }
# The harness's own zenpixels revision: the docs examples it compiles use its
# `ConvertOptions::retain_channels`. It descends from f8596aae, the revision the
# pinned zenjpeg and zenpng heads (and zenpipe 874a3856) were tested with.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "86d0e2d30406a006bf8332f142029b7f58353086" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "86d0e2d30406a006bf8332f142029b7f58353086" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-coroutine = { path = "../../zencodec-coroutine" }
zenmeta = { path = "../../zenmeta" }

[dev-dependencies]
kamadak-exif = "0.6.1"

[profile.release]
debug = 1
lto = "thin"
