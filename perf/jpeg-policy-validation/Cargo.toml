[package]
name = "jpeg-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
# Review-only native patch in perf/retained-decode-validation.
retained-output = []
retained-output-bench = ["retained-output", "dep:zenbench"]
# The effective-job preflight scenarios: planning (`EncodeJob::plan_encode`)
# against native startup (`Encoder::begin_declared`) on the pinned zenjpeg.
# They began as a patch experiment and now run on zenjpeg's shared hooks.
native-preflight = []

[dependencies]
zenbench = { version = "0.1.11", optional = true }
zencodec = { path = "../..", version = ">=0.2.0, <0.4.0", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-coroutine = { path = "../../zencodec-coroutine", version = "0.1.0" }
zenmeta = { path = "../../zenmeta", features = ["rewrite", "xmp"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["icc-db"] }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "6d6539dfaf3b9e09d74ad9ef7a56b4e4e7518dd0", features = ["controlled-decode", "metadata-rewrite", "extended-metadata"] }

zencodecs = { git = "https://github.com/imazen/zenpipe", rev = "f03224661f6912221f75dd7a43b1329431cc2e16", default-features = false, features = ["std", "cms", "jpeg", "png", "checked-transcode-async"] }

[patch.crates-io]
# Frozen stable JPEG PR260 cohort; preserve its kernels and repeat root patches.
zenresize = { git = "https://github.com/imazen/zenresize", rev = "5c5fe0d53b8264a162bc1eba08d2cd4ea2094f4b" }
zenblend = { git = "https://github.com/imazen/zenblend", rev = "d477b29c4ffbbcf8bb5f20070b44dac2caf6cf26" }
zentone = { git = "https://github.com/imazen/zentone", rev = "2598054c140bad5cdbe66205dacedc49150dea3d" }
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "8f9aa10d09f84bb0a1e3fdbd1773f610eec1b784" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "2969ee846e92a4f00f34ab447edaf1eb6857ebe0" }
# Paired PNG requires the unpublished 0.4 DEFLATE family.
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a2c7d540fc8f044f7c75398f1c49775560021862" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "6d6539dfaf3b9e09d74ad9ef7a56b4e4e7518dd0" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "d32e82e529e27433b89de3697ae69d0b62fa8c22" }
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-coroutine = { path = "../../zencodec-coroutine" }
zenmeta = { path = "../../zenmeta" }
# zenjpeg depends on ultrahdr-core unconditionally; crates.io 0.6.0 requires
# zencodec ^0.1, so use the review revision on the zencodec 0.2 family pin.
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "5a3b158c35cdabc5e9de1ef4fb79e0242c99b815" }
# Paired exact-depth/conversion revision used by the qualified optional-control
# native codecs and zenpipe checked-publication candidate.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-coroutine = { path = "../../zencodec-coroutine" }
zenmeta = { path = "../../zenmeta" }

[dev-dependencies]
zenpng = { version = "0.2.0", default-features = false, features = ["controlled-decode"] }
zencodec-testkit = { path = "../../zencodec-testkit", version = "0.2.0" }
how-far-along = { version = "0.1.0", default-features = false, features = ["std"] }
how-far-really = "0.1.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
kamadak-exif = "0.6.1"

[profile.release]
debug = 1
lto = "thin"

[[bench]]
name = "retained_decode"
harness = false
required-features = ["retained-output-bench"]
