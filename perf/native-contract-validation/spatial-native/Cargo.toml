[package]
name = "native-contract-spatial"
version = "0.0.0"
edition = "2024"
publish = false
description = "Region read planning before compressed reads over the native TIFF parser"

[workspace]

[dependencies]
zencodec = { path = "../../..", features = ["std"] }
# The TIFF parity fork perf/spatial-validation qualifies.
tiff = { version = "0.11.3", git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5", default-features = false, features = ["lzw", "deflate"] }

[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
zencodec = { path = "../../.." }

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
