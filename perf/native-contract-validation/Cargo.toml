[package]
name = "native-contract-validation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Executable witnesses of native encoder contract gaps (multi-pass, video retention)"

[workspace]

[dependencies]
multipass-validation = { path = "../multipass-validation" }
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../zencodec-media", features = ["std"] }
zenpixels = ">=0.2.14, <0.4.0"
enough = "0.4.4"

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Paired precision verifier; release requires these APIs in published zenpixels.
[patch.crates-io]
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "283655c5424e0ad7ebc6d2acd94670fac1e29158" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "283655c5424e0ad7ebc6d2acd94670fac1e29158" }
