[package]
name = "native-contract-validation"
version = "0.0.0"
edition = "2024"
publish = false
description = "Executable witnesses of native encoder contract gaps (multi-pass, video retention)"

[workspace]

[dependencies]
multipass-validation = { path = "../multipass-validation" }
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../zencodec-media", features = ["std"] }
zenpixels = ">=0.5.0, <0.6.0"
enough = "0.4.4"

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

# Paired precision verifier; release requires these APIs in published zenpixels.
[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }
