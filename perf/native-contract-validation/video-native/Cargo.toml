[package]
name = "native-contract-video"
version = "0.0.0"
edition = "2024"
publish = false
description = "Native AV1 encoder retention and delay facts for the video encoder contract"

[workspace]

[dependencies]
zencodec = { path = "../../..", features = ["std"] }
zencodec-io = { path = "../../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../../zencodec-media", features = ["std"] }
zenpixels = ">=0.2.16, <0.4.0"
# The native encoder revision perf/av1-policy-validation qualifies.
zenavif = { git = "https://github.com/imazen/zenavif", rev = "94116d266299f347cfd10a75d440a5bc3b598d2c", features = ["media-encode", "_dev"] }
# The decoder the AV1 harness pins beside it, for its native metadata accessors.
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "b19aec6561204ff310250bf2bc1b2c6faa42c3b5", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
zenmeta = { path = "../../../zenmeta" }
zencodec = { path = "../../.." }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7e9d296c9e037e626234c9f0e8673d48278f83f0" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../../.." }
zencodec-io = { path = "../../../zencodec-io" }
zencodec-media = { path = "../../../zencodec-media" }
zenmeta = { path = "../../../zenmeta" }

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
