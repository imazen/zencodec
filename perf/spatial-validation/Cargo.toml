[package]
name = "spatial-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
http = ["dep:ureq"]

[dependencies]
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../zencodec-media" }
tiff = { version = "0.11.3", git = "https://github.com/lilith/image-tiff", rev = "0219e7099c658422d47bd986ff279b686202b2e0", default-features = false, features = ["lzw", "deflate"] }
zenjxl-decoder = { version = "0.4.0", git = "https://github.com/imazen/zenjxl-decoder", rev = "189f8585b1a28ac9fa7413c24a2ed3914126e77a", default-features = false }
jxl-encoder = { version = "0.4.0", git = "https://github.com/imazen/jxl-encoder", rev = "0255e5a9f61b7270cb3ed3f7b85fec2283deec55", default-features = false, features = ["std"] }
codec-corpus = "1.1.0"
zenpixels = ">=0.2.17, <0.4.0"
zenpixels-convert = ">=0.2.17, <0.4.0"
ureq = { version = "3.5.0", default-features = false, optional = true }

[patch.crates-io]
# Native TIFF/IMIJ sample carriage under review in zenpixels PR 93.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "9dad0cb609bbc07ed329696902ed5a1a3d3951b6" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "9dad0cb609bbc07ed329696902ed5a1a3d3951b6" }

[profile.release]
debug = 1
lto = "thin"
