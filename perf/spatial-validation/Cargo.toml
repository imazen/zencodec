[package]
name = "spatial-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
http = ["dep:ureq"]
file_snapshot = ["dep:rustix"]
cms_oracle = []
old_jpeg = ["tiff/jpeg", "dep:zenmeta"]

[dependencies]
zencodec-render = { path = "../../zencodec-render" }
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta", features = ["inventory"], optional = true }
tiff = { version = "0.11.3", git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5", default-features = false, features = ["lzw", "deflate"] }
zenjxl-decoder = { version = "0.4.0", git = "https://github.com/imazen/zenjxl-decoder", rev = "1514ee496526d6fadd518ff109a658acf135aa07", default-features = false }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "8b86f9a2bcfee893ece89f7976b9132bfd88d315", default-features = false, features = ["collections"] }
jxl-encoder = { version = "0.4.0", git = "https://github.com/imazen/jxl-encoder", rev = "754699f734bea9d9642834e2d21ccf792ed8ea74", default-features = false, features = ["std"] }
codec-corpus = "1.1.0"
bytemuck = "1.25.2"
serde_json = "1.0.151"
zenpixels = ">=0.2.17, <0.4.0"
zenpixels-convert = { version = ">=0.2.17, <0.4.0", features = ["cms-moxcms"] }
ureq = { version = "3.5.0", default-features = false, optional = true }
rustix = { version = "1.1.5", features = ["fs"], optional = true }

[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "8f9aa10d09f84bb0a1e3fdbd1773f610eec1b784" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
zencodec = { path = "../.." }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "1514ee496526d6fadd518ff109a658acf135aa07" }
# Combined output planning and native sample carriage from zenpixels PRs 92/93.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }

[profile.release]
debug = 1
lto = "thin"

# Execute the full native matrix within its existing CI timeout. Keep the
# correctness checks enabled; unoptimized codec loops dominate this harness.
[profile.test]
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true
