[package]
name = "spatial-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
http = ["dep:ureq"]
file_snapshot = ["dep:rustix"]
cms_oracle = []
old_jpeg = ["tiff/jpeg", "dep:zenmeta"]

[dependencies]
zencodec-render = { path = "../../zencodec-render" }
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta", features = ["inventory"], optional = true }
tiff = { version = "0.11.3", git = "https://github.com/lilith/image-tiff", rev = "10a3b6b2fa88eb5943525066a989ea9e64e644d5", default-features = false, features = ["lzw", "deflate"] }
zenjxl-decoder = { version = "0.4.0", git = "https://github.com/imazen/zenjxl-decoder", rev = "fe819360581acb3796ea2925f2a81f44f0a430e6", default-features = false }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "a76ac76d080295b754d970a3392eed8f964de490", default-features = false, features = ["collections"] }
jxl-encoder = { version = "0.4.0", git = "https://github.com/imazen/jxl-encoder", rev = "554ad6966771bc2b6f79d6a6c569f55ce155644a", default-features = false, features = ["std"] }
codec-corpus = "1.1.0"
bytemuck = "1.25.2"
serde_json = "1.0.151"
zenpixels = ">=0.2.17, <0.4.0"
zenpixels-convert = { version = ">=0.2.17, <0.4.0", features = ["cms-moxcms"] }
ureq = { version = "3.5.0", default-features = false, optional = true }
rustix = { version = "1.1.5", features = ["fs"], optional = true }

[patch.crates-io]
zencodec = { path = "../.." }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "fe819360581acb3796ea2925f2a81f44f0a430e6" }
# Combined output planning and native sample carriage from zenpixels PRs 92/93.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }

[profile.release]
debug = 1
lto = "thin"

# Execute the full native matrix within its existing CI timeout. Keep the
# correctness checks enabled; unoptimized codec loops dominate this harness.
[profile.test]
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true
