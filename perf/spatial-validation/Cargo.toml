[package]
name = "spatial-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
http = ["dep:ureq"]
file_snapshot = ["dep:rustix"]

[dependencies]
zencodec = { path = "../..", features = ["std"] }
zencodec-io = { path = "../../zencodec-io", features = ["std"] }
zencodec-media = { path = "../../zencodec-media" }
tiff = { version = "0.11.3", git = "https://github.com/lilith/image-tiff", rev = "0219e7099c658422d47bd986ff279b686202b2e0", default-features = false, features = ["lzw", "deflate"] }
zenjxl-decoder = { version = "0.4.0", git = "https://github.com/imazen/zenjxl-decoder", rev = "fe819360581acb3796ea2925f2a81f44f0a430e6", default-features = false }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "d5fe3e2b51259c4f644fd9071a4f3d8a56f80223", default-features = false, features = ["collections"] }
jxl-encoder = { version = "0.4.0", git = "https://github.com/imazen/jxl-encoder", rev = "0255e5a9f61b7270cb3ed3f7b85fec2283deec55", default-features = false, features = ["std"] }
codec-corpus = "1.1.0"
serde_json = "1.0.151"
zenpixels = ">=0.2.17, <0.4.0"
zenpixels-convert = ">=0.2.17, <0.4.0"
ureq = { version = "3.5.0", default-features = false, optional = true }
rustix = { version = "1.1.5", features = ["fs"], optional = true }

[patch.crates-io]
zencodec = { path = "../.." }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "fe819360581acb3796ea2925f2a81f44f0a430e6" }
# Native TIFF/IMIJ sample carriage under review in zenpixels PR 93.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "284a0598abf441dc886755b1e65c34dbdf6ce94d" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "284a0598abf441dc886755b1e65c34dbdf6ce94d" }

[profile.release]
debug = 1
lto = "thin"

# Execute the full native matrix within its existing CI timeout. Keep the
# correctness checks enabled; unoptimized codec loops dominate this harness.
[profile.test]
opt-level = 1
debug = 1
debug-assertions = true
overflow-checks = true
