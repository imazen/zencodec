[package]
name = "av1-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zencodec-io = { path = "../../zencodec-io", version = "0.1.0", features = ["std"] }
zencodec = { path = "../..", version = ">=0.1.27, <0.3.0", features = ["std"] }
zencodec-media = { path = "../../zencodec-media", features = ["std"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", default-features = false }
enough = "0.4.4"
bytemuck = "1.25.2"
zenavif = { git = "https://github.com/imazen/zenavif", rev = "b25f7604fbb71ead6517ec27fa52646770e3606a", features = ["media-encode", "_dev"] }
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "b19aec6561204ff310250bf2bc1b2c6faa42c3b5", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
zenmp4 = { git = "https://github.com/imazen/zenavif", rev = "b25f7604fbb71ead6517ec27fa52646770e3606a", version = "0.1.0" }
zenivf = { git = "https://github.com/imazen/zenextras", rev = "1af38ae83024830a141744fb3a565503bdc61af3", version = "0.1.0" }
zenwebm = { git = "https://github.com/imazen/zenextras", rev = "1af38ae83024830a141744fb3a565503bdc61af3", version = "0.1.0" }

[patch.crates-io]
zencodec = { path = "../.." }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "86d0e2d30406a006bf8332f142029b7f58353086" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "86d0e2d30406a006bf8332f142029b7f58353086" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "10a79c3a888dd589884fd032846eec70bc31eb13" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta" }

[profile.release]
debug = 1
lto = "thin"
