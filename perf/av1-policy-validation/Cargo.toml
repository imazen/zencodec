[package]
name = "av1-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zencodec-io = { path = "../../zencodec-io", version = "0.1.0", features = ["std"] }
zencodec = { path = "../..", version = ">=0.2.0, <0.4.0", features = ["std"] }
zencodec-media = { path = "../../zencodec-media", features = ["std"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", default-features = false }
enough = "0.4.4"
bytemuck = "1.25.2"
zenavif = { git = "https://github.com/imazen/zenavif", rev = "94116d266299f347cfd10a75d440a5bc3b598d2c", features = ["media-encode", "_dev"] }
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "b19aec6561204ff310250bf2bc1b2c6faa42c3b5", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
zenmp4 = { git = "https://github.com/imazen/zenavif", rev = "94116d266299f347cfd10a75d440a5bc3b598d2c", version = "0.1.0" }
zenivf = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc", version = "0.1.0" }
zenwebm = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc", version = "0.1.0" }

[patch.crates-io]
zencodec-io = { path = "../../zencodec-io" }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta" }
zencodec = { path = "../.." }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7e9d296c9e037e626234c9f0e8673d48278f83f0" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta" }

[profile.release]
debug = 1
lto = "thin"
