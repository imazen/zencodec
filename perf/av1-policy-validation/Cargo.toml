[package]
name = "av1-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zencodec = { path = "../..", version = ">=0.1.27, <0.3.0", features = ["std"] }
zencodec-media = { path = "../../zencodec-media" }
zenpixels = ">=0.2.16, <0.4.0"
enough = "0.4.4"
zenavif = { git = "https://github.com/imazen/zenavif", rev = "ea055f7de6a34d2b9a9942b39a3166801d6972e3", features = ["media-encode"] }
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "5707a2e94ac88500892c9c7ad2ec77d5ab84fd59", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[patch.crates-io]
zencodec = { path = "../.." }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "10a79c3a888dd589884fd032846eec70bc31eb13" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta" }

[profile.release]
debug = 1
lto = "thin"
