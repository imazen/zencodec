[package]
name = "av1-policy-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zencodec-io = { path = "../../zencodec-io", version = "0.1.0", features = ["std"] }
zencodec = { path = "../..", version = ">=0.2.0, <0.4.0", features = ["std"] }
zencodec-media = { path = "../../zencodec-media", features = ["std"] }
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = { version = ">=0.2.16, <0.4.0", default-features = false }
enough = "0.4.4"
bytemuck = "1.25.2"
zenavif = { git = "https://github.com/imazen/zenavif", rev = "b0901f3c87ce414012d6a8c933765c183c94e588", features = ["media-encode", "_dev"] }
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "68e499ec455dc6bc29ee4b69abd64022a6099411", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
zenmp4 = { git = "https://github.com/imazen/zenavif", rev = "b0901f3c87ce414012d6a8c933765c183c94e588", version = "0.1.0" }
zenivf = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc", version = "0.1.0" }
zenwebm = { git = "https://github.com/imazen/zenextras", rev = "403d46b9973a58b212def0602f4dd8cdee9560dc", version = "0.1.0" }

[patch.crates-io]
# Transitive workspace patches from the pinned zenpixels cohort must be repeated here.
garb = { git = "https://github.com/imazen/garb", rev = "58ce9cad7b337418a7abe9b1f6e3e4bd1928b385" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }
zencodec-io = { path = "../../zencodec-io" }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta" }
zencodec = { path = "../.." }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "76005fc99a7c822af1801a1f9f87e7d3dc98c510" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "5bdb194b64c39052f33d84f6d772158b5e660802" }

[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "../.." }
zencodec-io = { path = "../../zencodec-io" }
zencodec-media = { path = "../../zencodec-media" }
zenmeta = { path = "../../zenmeta" }

[profile.release]
debug = 1
lto = "thin"

[dev-dependencies]
zencodec-media-testkit = { path = "../../zencodec-media-testkit", version = "0.1.0" }
presentation-map-experiment = { path = "../presentation-map" }
